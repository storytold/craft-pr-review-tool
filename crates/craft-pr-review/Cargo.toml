[package]
name = "craft-pr-review"
description = "Tray app for reviewing open PRs across the storytold craft apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "craft_pr_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
craft-core.workspace = true
craft-github.workspace = true
pr-core.workspace = true
pr-github.workspace = true
pr-claude.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
